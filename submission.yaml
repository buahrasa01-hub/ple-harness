# Dev-run harness for the Kaggle PLE Agent Harness competition
# (google-research/ple, kit pinned at 8320f0402fdca9f42476607f72bcfd5271cd50c9).
# Runs on a free model (OpenRouter) for dev-set evaluation via GitHub Actions.
# The competition submission will switch model_api to a google-cloud/<id>
# model; this entry is local/dev only and is never reported ready to submit.
name: ple-harness
model_api: openai-compatible/nvidia/nemotron-3.5-super-vl:free
model_base_url: https://openrouter.ai/api/v1
install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt
serve: /opt/harness/venv/bin/python {src}/serve.py
